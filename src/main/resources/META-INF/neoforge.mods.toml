modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="xenonpcs_logo.png"
description='''${mod_description}'''

[[mixins]]
config="xenonpcs.mixins.json"

[[mixins]]
config="xenonpcs.compat.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# DragonMineZ: required, deliberately not ordered (an ordering edge closes dependency cycles
# with DMZ addons; nothing here needs it - see XenoPixels' mods.toml for the full reasoning).
[[dependencies.${mod_id}]]
modId="dragonminez"
type="required"
versionRange="[2.1.3,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
type="required"
versionRange="[4.9,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
type="optional"
versionRange="[9,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="customnpcs"
type="optional"
versionRange="[1.21.1,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="cnpcgeckoaddon"
type="optional"
versionRange="[1.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mynpcs"
type="optional"
versionRange="[1.5.0,)"
ordering="AFTER"
side="BOTH"

# XenoPixels Network already contains the whole XenoNPCs system; installing both would register
# every NPC twice under two names.
[[dependencies.${mod_id}]]
modId="xenopixelsmod"
type="incompatible"
reason="XenoPixels Network already includes XenoNPCs. Remove one of them."
versionRange="[0,)"
ordering="NONE"
side="BOTH"
