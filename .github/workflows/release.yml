name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v0.0.2
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.21.1'
            java: '21'
            ref: ''
          - minecraft: '1.20.1'
            java: '17'
            # Pin the Forge export so re-running a release never builds a moving branch.
            ref: '9e10c2abd6f08795eaa6c1d671373439ff55ab31'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref || inputs.tag || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        env:
          MC_VERSION: ${{ matrix.minecraft }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "invalid release tag" >&2; exit 1; }
          VERSION="${RELEASE_TAG#v}"
          chmod +x gradlew
          if [ "$MC_VERSION" = '1.21.1' ]; then
            test -s libs/dragonminez-2.1.3.jar
            ./gradlew build --no-daemon -PofflineMcMeta -Pmod_version="$VERSION"
          else
            ./gradlew build --no-daemon -Pmod_version="$VERSION"
          fi

      - name: Select the runtime jar
        env:
          MC_VERSION: ${{ matrix.minecraft }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if [ "$MC_VERSION" = '1.21.1' ]; then
            jar="build/libs/xenonpcs-${VERSION}.jar"
          else
            jar="build/libs/xenonpcs-${VERSION}-${MC_VERSION}-all.jar"
            jar tf "$jar" | grep -Fx 'META-INF/jarjar/mixinextras-forge-0.4.1.jar' >/dev/null
          fi
          test -s "$jar"
          mkdir -p release-assets
          cp "$jar" "release-assets/xenonpcs-${VERSION}-${MC_VERSION}.jar"
          sha256sum release-assets/*.jar

      - uses: actions/upload-artifact@v4
        with:
          name: xenonpcs-${{ matrix.minecraft }}
          path: release-assets/*.jar
          if-no-files-found: error

  publish:
    name: Publish both Minecraft versions
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xenonpcs-*
          path: release-assets
          merge-multiple: true

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          jars=("release-assets/xenonpcs-${VERSION}-1.20.1.jar" "release-assets/xenonpcs-${VERSION}-1.21.1.jar")
          for jar in "${jars[@]}"; do test -s "$jar"; done
          sha256sum "${jars[@]}"
          cat > release-notes.md <<'NOTES'
          Choose the jar matching your Minecraft version and loader:
          - Minecraft 1.20.1: Forge 47.4.10, Java 17.
          - Minecraft 1.21.1: NeoForge 21.1.248, Java 21.

          DragonMineZ 2.1.3 and GeckoLib are required. Do not install XenoNPCs alongside XenoPixels.

          Changes in this release:
          - NPC melee damage now lands on players: the real hit is set before DragonMineZ records the raw damage (both versions).
          - 1.20.1: NPC DragonMineZ stats are stored on the NPC, so battle power and damage are no longer zero.
          - New NPCs start with DragonMineZ's base stats for their race and class; NPCs still at all-zero stats are repaired once.
          - NPCs walking home after a chase disengage until they arrive, instead of turning back and forth.
          - A "kill target hunts player" quest never turns its own quest giver on the player.
          - 1.20.1: speech and dialogue bubbles draw above NPCs (as DragonMineZ's ki-sense meter does) and hide clouds behind them.
          - The NPC arm swings on hits when no combat clip can play; the greeting wave clips load on both versions.
          - NPC editor screens follow the GUI Scale; the colour picker opens at full brightness; the XenoSkill points quest reward is removed.

          Both builds run their unit tests before publishing. Forge's 34 runtime-only tests are listed in EXPORT_REPORT.md and remain excluded from plain JUnit. Answer bubbles may still show clouds through them on 1.20.1 (under investigation). MyNPCs compatibility is omitted from the 1.20.1 export.
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${jars[@]}" --clobber
            gh release edit "$RELEASE_TAG" --draft=false --title "XenoNPCs $RELEASE_TAG — 1.20.1 and 1.21.1" --notes-file release-notes.md
            # Remove the obsolete unlabelled assets only after both replacements are available.
            for old in "xenonpcs-${VERSION}.jar" "xenonpcs-${VERSION}-sources.jar"; do
              if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$old"; then
                gh release delete-asset "$RELEASE_TAG" "$old" --yes
              fi
            done
          else
            gh release create "$RELEASE_TAG" "${jars[@]}" \
              --title "XenoNPCs $RELEASE_TAG — 1.20.1 and 1.21.1" --notes-file release-notes.md
          fi
