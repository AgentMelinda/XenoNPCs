name: Build

on:
  push:
    branches: [ "1.21.1" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Use the committed dependency and fail if it is missing or differs from the pin.
      - name: Verify DragonMineZ 2.2
        run: |
          want=$(sed -n 's/^dragonminez_sha256=//p' gradle.properties | tr -d '\r')
          echo "$want  libs/dragonminez-2.2.jar" | sha256sum -c -

      - name: Build and test
        run: ./gradlew build --no-daemon -PofflineMcMeta

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: xenonpcs-jar
          path: build/libs/*.jar
