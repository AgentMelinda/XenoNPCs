name: Build 1.20.1

on:
  push:
    branches: [ "1.20.1" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # DragonMineZ comes from CurseMaven; the optional CustomNPCs / CNPC Gecko Addon jars are in libs/.
      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: xenonpcs-1.20.1-jar
          path: build/libs/xenonpcs-0.0.5-1.20.1-all.jar
          if-no-files-found: error
      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: xenonpcs-1.20.1-sources
          path: build/libs/xenonpcs-0.0.5-1.20.1-sources.jar
          if-no-files-found: error
