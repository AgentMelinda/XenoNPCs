name: Build

on:
  push:
    branches: [ "1.21.1" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Fetch the exact upstream asset and verify it against the Gradle dependency pin.
      - name: Fetch DragonMineZ 2.2.1
        run: |
          mkdir -p libs
          want=$(sed -n 's/^dragonminez_sha256=//p' gradle.properties | tr -d '\r')
          curl --fail --location --retry 3 --output libs/dragonminez-2.2.1.jar https://github.com/AgentMelinda/dragonminez-1.21.1/releases/download/1.21.1-v2.2.1-halo-fixes.2/dragonminez-2.2.1.jar
          echo "$want  libs/dragonminez-2.2.1.jar" | sha256sum -c -

      - name: Build and test
        run: ./gradlew build --no-daemon -PofflineMcMeta

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: xenonpcs-jar
          path: build/libs/*.jar
