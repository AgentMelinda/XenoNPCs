name: Build

on:
  push:
    branches: [ "1.21.1" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # DragonMineZ is not redistributed in this repository: take it from its upstream release and
      # check it against the hash in gradle.properties before building anything against it.
      - name: Download DragonMineZ
        run: |
          mkdir -p libs
          curl -fsSL -o libs/dragonminez-2.1.3.jar \
            https://github.com/AgentMelinda/dragonminez/releases/download/v2.1.3-1.21.1-kiweapon-fix/dragonminez-2.1.3.jar
          want=$(grep -E '^dragonminez_sha256=' gradle.properties | cut -d= -f2)
          echo "$want  libs/dragonminez-2.1.3.jar" | sha256sum -c -

      - name: Build and test
        run: ./gradlew build --no-daemon -PofflineMcMeta

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: xenonpcs-jar
          path: build/libs/*.jar
