// XenoNPCs - generated from XenoPixels by tools/xenonpcs/export_xenonpcs.py (the build is the
// hand-written part). Requires DragonMineZ 2.1.3: put dragonminez-2.1.3.jar in libs/ or pass
// -PdmzJar=path. GeckoLib comes from its maven; CustomNPCs / My NPCs / Curios are optional.
plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = file('run')
        }
        server {
            server()
            gameDirectory = file('run')
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.xenonpcs
    }
}

def useVendoredMcMeta = findProperty('offlineMcMeta') != null || System.getenv('CI') != null

repositories {
    mavenCentral()
    if (useVendoredMcMeta) {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Vendored Minecraft 1.21.1 Metadata'
                    url = layout.projectDirectory.dir('gradle/minecraft-metadata')
                    metadataSources { mavenPom() }
                }
            }
            filter { includeModule 'net.neoforged', 'minecraft-dependencies' }
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter { includeGroupByRegex 'software\\.bernie.*' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'TerraBlender'
                url = 'https://maven.minecraftforge.net/'
            }
        }
        filter { includeGroup 'com.github.glitchfiend' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Curios'
                url = 'https://maven.theillusivec4.top/'
            }
        }
        filter { includeGroup 'top.theillusivec4.curios' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://cursemaven.com'
            }
        }
        filter { includeGroup 'curse.maven' }
    }
}

def dragonMineZJar = {
    def explicit = findProperty('dmzJar') ?: System.getenv('DMZ_JAR')
    def f = explicit ? file(explicit) : file("libs/dragonminez-${dragonminez_version}.jar")
    if (!f.isFile()) {
        throw new GradleException("DragonMineZ ${dragonminez_version} jar not found at ${f}. " +
                "Put dragonminez-${dragonminez_version}.jar in libs/ or pass -PdmzJar=path.")
    }
    def actual = java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()
    if (actual != dragonminez_sha256) {
        throw new GradleException("DragonMineZ SHA-256 mismatch: expected ${dragonminez_sha256}, got ${actual}")
    }
    return f
}()

dependencies {
    implementation files(dragonMineZJar)
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}"
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    // DragonMineZ itself requires TerraBlender (and GeckoLib, Curios) to load.
    implementation "com.github.glitchfiend:TerraBlender-neoforge:${terrablender_version}"
    compileOnly "curse.maven:my-npcs-1569534:8686540"
    compileOnly "curse.maven:customnpcs-unofficial-1052708:8414335"
    compileOnly "curse.maven:cnpc-gecko-addon-970162:7272203"
    // NPC scripting runs on Nashorn; bundled so servers need nothing extra.
    implementation "org.openjdk.nashorn:nashorn-core:${nashorn_version}"
    jarJar("org.openjdk.nashorn:nashorn-core:${nashorn_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll '-Xlint:-deprecation', '-Xlint:-removal', '-Xmaxerrs', '10000'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // The script tests compile every example in examples/customnpcs from here.
    systemProperty 'xenopixels.projectDir', projectDir.absolutePath
}

def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// ModDev embeds jarJar dependencies into this runtime jar. Label it explicitly.
tasks.named('jar', Jar).configure {
    archiveClassifier = 'all'
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : mod_version,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors,
                'MixinConfigs'          : 'xenonpcs.mixins.json,xenonpcs.compat.mixins.json'
        ])
    }
}

tasks.named('build') { dependsOn 'jarJar' }

// Fresh isolated probes are a separate mod and are never packaged in XenoNPCs.
sourceSets {
    releaseProbe {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
if (providers.gradleProperty('releaseProbe').isPresent()) {
    neoForge.mods { xenonpcs_release_probe { sourceSet sourceSets.releaseProbe } }
    ['Client', 'Server'].each { side ->
        def directory = layout.buildDirectory.dir("release-runtime/${side.toLowerCase()}/core")
        def prepare = tasks.register("prepareRelease${side}Probe") {
            doLast {
                def dir = directory.get().asFile
                dir.mkdirs()
                if (side == 'Server') {
                    new File(dir, 'eula.txt').text = 'eula=true\n'
                    new File(dir, 'server.properties').text = 'online-mode=false\nserver-port=0\nlevel-name=probe-flat-v2\nlevel-type=minecraft:flat\ngenerator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains","features":false,"lakes":false,"structure_overrides":[]}\ngenerate-structures=false\nview-distance=2\nsimulation-distance=2\n'
                }
            }
        }
        neoForge.runs.named(side.toLowerCase()).configure {
            gameDirectory = directory.get().asFile
            systemProperty 'xenonpcs.releaseProbe', 'true'
            systemProperty 'xenonpcs.releaseProfile', 'core'
            systemProperty 'mixin.debug.countInjections', 'true'
        }
        tasks.named("run${side}").configure {
            dependsOn prepare, tasks.named('releaseProbeClasses')
            doLast {
                def log = new File(directory.get().asFile, 'logs/latest.log').text
                if (!log.contains("XENONPCS_PROBE_${side.toUpperCase()}_PASS") ||
                        log =~ /(?i)(mixin apply .*failed|InvalidInjectionException|InjectionError|Critical injection failure)/) {
                    throw new GradleException("Release ${side} probe failed; inspect ${directory.get()}/logs/latest.log")
                }
            }
        }
    }
}

// The vendored client metadata lacks Windows classifiers; resolve them only for local probes.
if (providers.gradleProperty('releaseProbe').isPresent() && System.getProperty('os.name').startsWith('Windows')) {
    configurations { makerProbeNatives }
    dependencies {
        ['lwjgl', 'lwjgl-glfw', 'lwjgl-jemalloc', 'lwjgl-openal', 'lwjgl-opengl', 'lwjgl-stb', 'lwjgl-tinyfd', 'lwjgl-freetype'].each { module ->
            makerProbeNatives "org.lwjgl:${module}:3.3.3:natives-windows"
        }
    }
    def nativesDir = layout.buildDirectory.dir('maker-probe-natives')
    def extractNatives = tasks.register('extractMakerProbeNatives', Copy) {
        from { configurations.makerProbeNatives.collect { zipTree(it) } }
        include '**/*.dll'
        eachFile { path = name }
        includeEmptyDirs = false
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        into nativesDir
    }
    neoForge.runs.named('client').configure { systemProperty 'org.lwjgl.librarypath', nativesDir.get().asFile.absolutePath }
    tasks.named('runClient').configure { dependsOn extractNatives }
}
