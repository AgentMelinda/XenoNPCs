// XenoNPCs - generated from XenoPixels by tools/xenonpcs/export_xenonpcs.py (the build is the
// hand-written part). Requires DragonMineZ 2.1.3: put dragonminez-2.1.3.jar in libs/ or pass
// -PdmzJar=path. GeckoLib comes from its maven; CustomNPCs / My NPCs / Curios are optional.
plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = file('run')
        }
        server {
            server()
            gameDirectory = file('run')
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.xenonpcs
    }
}

def useVendoredMcMeta = findProperty('offlineMcMeta') != null || System.getenv('CI') != null

repositories {
    mavenCentral()
    if (useVendoredMcMeta) {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Vendored Minecraft 1.21.1 Metadata'
                    url = layout.projectDirectory.dir('gradle/minecraft-metadata')
                    metadataSources { mavenPom() }
                }
            }
            filter { includeModule 'net.neoforged', 'minecraft-dependencies' }
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter { includeGroupByRegex 'software\\.bernie.*' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'TerraBlender'
                url = 'https://maven.minecraftforge.net/'
            }
        }
        filter { includeGroup 'com.github.glitchfiend' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Curios'
                url = 'https://maven.theillusivec4.top/'
            }
        }
        filter { includeGroup 'top.theillusivec4.curios' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://cursemaven.com'
            }
        }
        filter { includeGroup 'curse.maven' }
    }
}

def dragonMineZJar = {
    def explicit = findProperty('dmzJar') ?: System.getenv('DMZ_JAR')
    def f = explicit ? file(explicit) : file("libs/dragonminez-${dragonminez_version}.jar")
    if (!f.isFile()) {
        throw new GradleException("DragonMineZ ${dragonminez_version} jar not found at ${f}. " +
                "Put dragonminez-${dragonminez_version}.jar in libs/ or pass -PdmzJar=path.")
    }
    return f
}()

dependencies {
    implementation files(dragonMineZJar)
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}"
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    // DragonMineZ itself requires TerraBlender (and GeckoLib, Curios) to load.
    implementation "com.github.glitchfiend:TerraBlender-neoforge:${terrablender_version}"
    compileOnly "curse.maven:my-npcs-1569534:8686540"
    compileOnly "curse.maven:customnpcs-unofficial-1052708:8414335"
    compileOnly "curse.maven:cnpc-gecko-addon-970162:7272203"
    // NPC scripting runs on Nashorn; bundled so servers need nothing extra.
    implementation "org.openjdk.nashorn:nashorn-core:${nashorn_version}"
    jarJar("org.openjdk.nashorn:nashorn-core:${nashorn_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll '-Xlint:-deprecation', '-Xlint:-removal', '-Xmaxerrs', '10000'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // The script tests compile every example in examples/customnpcs from here.
    systemProperty 'xenopixels.projectDir', projectDir.absolutePath
}

def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// ModDev embeds jarJar dependencies into this runtime jar. Label it explicitly.
tasks.named('jar', Jar).configure {
    archiveClassifier = 'all'
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : mod_version,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors,
                'MixinConfigs'          : 'xenonpcs.mixins.json,xenonpcs.compat.mixins.json'
        ])
    }
}

tasks.named('build') { dependsOn 'jarJar' }
